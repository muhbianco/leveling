# =============================================================================
# Leveling Keeper — Stack Portainer (Docker Swarm + Traefik) — hel1
# Stack: leveling            Serviço: leveling_keeper            Rede: chatbot-net
# Imagem: muhrilobianco/leveling-keeper:${LEVELING_TAG} (sha12 do commit; nunca `latest`).
# Painel: https://leveling.muhbianco.com.br (login Google; só /healthz e a tela de login abertos).
#
# Um container: FastAPI + supervisor + Playwright/Chromium com janela num Xvfb + x11vnc só em
# 127.0.0.1 (a tela remota passa pela ponte autenticada do painel). Mantém a sessão do Leveling
# Idle aberta quando a chave do painel está ligada; o cliente do jogo roda sem modificação.
#
# Env da stack (via hel1-ops/scripts/portainer-stack-update.py, que reenvia todas as chaves):
#   LEVELING_TAG       sha12 da imagem (o pipeline troca a cada deploy)
#   GOOGLE_CLIENT_ID   cliente OAuth "Leveling Keeper" (não é segredo)
#   ADMIN_EMAILS       e-mails Google que entram no painel (vírgula); vazio = ninguém
# Segredos NÃO ficam no Env: /root/leveling-secrets/secrets.env (GAME_USERNAME, GAME_PASSWORD,
# GOOGLE_CLIENT_SECRET), criado por infra/install-secrets.sh e montado read-only. O app relê o
# arquivo a cada ciclo: trocar a senha não pede redeploy.
#
# Volume `leveling_data` (/data): perfil do Chromium (token do jogo), chave liga/desliga, eventos e
# sessões do painel. Fora do backup B2 de propósito: um login novo recupera tudo.
# =============================================================================

version: "3.8"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  keeper:
    image: muhrilobianco/leveling-keeper:${LEVELING_TAG:?LEVELING_TAG obrigatorio}
    logging: *logging
    environment:
      LOG_LEVEL: INFO
      PUBLIC_URL: https://leveling.muhbianco.com.br
      ADMIN_EMAILS: ${ADMIN_EMAILS:?ADMIN_EMAILS obrigatorio}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID obrigatorio}
      SECRETS_FILE: /run/leveling/secrets.env
      DATA_DIR: /data
      TZ: America/Sao_Paulo
    volumes:
      - data:/data
      - type: bind
        source: /root/leveling-secrets
        target: /run/leveling
        read_only: true
    networks:
      - chatbot-net
    # O Chromium fecha a página (o jogo vê o socket fechar limpo) antes do SIGKILL.
    stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      # Um navegador por vez: dois na mesma conta se derrubariam ("outro dispositivo").
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 10s
      resources:
        # Chromium + WebGL em software (sem GPU). Medir com `docker stats` e ajustar.
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=chatbot-net
        - traefik.http.routers.leveling.rule=Host(`leveling.muhbianco.com.br`)
        - traefik.http.routers.leveling.entrypoints=websecure
        - traefik.http.routers.leveling.tls.certresolver=letsencryptresolver
        - traefik.http.routers.leveling.service=leveling
        - traefik.http.routers.leveling.middlewares=leveling_headers
        - traefik.http.services.leveling.loadbalancer.server.port=8000
        - traefik.http.services.leveling.loadbalancer.passHostHeader=true
        - traefik.http.services.leveling.loadbalancer.healthcheck.path=/healthz
        - traefik.http.services.leveling.loadbalancer.healthcheck.interval=15s
        - traefik.http.middlewares.leveling_headers.headers.stsSeconds=31536000
        - traefik.http.middlewares.leveling_headers.headers.contentTypeNosniff=true
        - traefik.http.middlewares.leveling_headers.headers.referrerPolicy=no-referrer
        - traefik.http.middlewares.leveling_headers.headers.customFrameOptionsValue=DENY
        - traefik.http.middlewares.leveling_headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow

volumes:
  data:

networks:
  chatbot-net:
    external: true
    name: chatbot-net
