[project]
name = "leveling-keeper"
version = "0.1.0"
description = "Mantém a sessão do Leveling Idle aberta na hel1 quando o navegador do dono não pode ficar aberto"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # Depends() defaults are the FastAPI idiom
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108", "S311", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
log_level = "INFO"
# Teste travado: despeja a pilha de todas as threads (o CI tem teto de tempo).
faulthandler_timeout = 120
